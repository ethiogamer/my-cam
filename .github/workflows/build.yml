name: Build CamBridge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SOFTCAM_COMMIT: fa38d892bd931b761588f9b7641ba49f006953f0

jobs:
  iphone:
    name: iPhone app (.ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned — Sideloadly signs it)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project CamBridge.xcodeproj \
            -scheme CamBridge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CamBridge.app Payload/
          zip -qr CamBridge.ipa Payload
          ls -la CamBridge.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CamBridge-iPhone
          path: ios/CamBridge.ipa

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CamBridge.apk
          ls -la CamBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CamBridge-Android
          path: CamBridge.apk

  windows:
    name: Windows app (.exe)
    needs: [android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Softcam (virtual webcam library)
        shell: bash
        run: |
          git clone https://github.com/tshino/softcam.git ext/softcam
          cd ext/softcam && git checkout "$SOFTCAM_COMMIT"

      - name: Rename the camera to "CamBridge"
        shell: pwsh
        run: |
          $f = "ext/softcam/src/softcam/softcam.cpp"
          $s = Get-Content $f -Raw
          $s = $s.Replace('L"DirectShow Softcam"', 'L"CamBridge"')
          $s = $s.Replace('0xaef3b972, 0x5fa5, 0x4647, 0x95, 0x71, 0x35, 0x8e, 0xb4, 0x72, 0xbc, 0x9e',
                          '0x58ea431c, 0x1871, 0x4d1e, 0xb6, 0x0c, 0x5e, 0xa9, 0x92, 0xf2, 0x66, 0x70')
          if (-not $s.Contains('L"CamBridge"')) { throw "name patch failed" }
          if (-not $s.Contains('0x58ea431c')) { throw "id patch failed" }
          Set-Content $f $s -NoNewline

      - uses: microsoft/setup-msbuild@v2

      - name: Build camera driver (64-bit and 32-bit)
        working-directory: ext/softcam
        run: |
          nuget restore softcam.sln
          msbuild softcam.sln /m /t:softcam /p:Configuration=Release /p:Platform=x64
          msbuild softcam.sln /m /t:softcam /p:Configuration=Release /p:Platform=Win32

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build video decoder / MP4 recorder (cbvideo.dll)
        working-directory: windows
        shell: cmd
        run: |
          if not exist bin mkdir bin
          cl /nologo /O2 /EHsc /LD /std:c++17 /MT native\cbvideo.cpp /Fe:bin\cbvideo.dll /Fo:bin\ /link mfplat.lib mfuuid.lib mfreadwrite.lib ole32.lib
          if errorlevel 1 exit /b 1
          dir bin

      - name: Collect driver files
        shell: bash
        run: |
          mkdir -p windows/bin
          cp ext/softcam/x64/Release/softcam.dll windows/bin/cambridge64.dll
          cp ext/softcam/Win32/Release/softcam.dll windows/bin/cambridge32.dll
          ls -la windows/bin

      - name: Get the Android app (to install it on phones automatically)
        uses: actions/download-artifact@v4
        with:
          name: CamBridge-Android
          path: windows/bin

      - name: Get Android USB tool (adb)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force windows/bin/platform-tools | Out-Null
          foreach ($f in "adb.exe","AdbWinApi.dll","AdbWinUsbApi.dll") { Copy-Item "pt/platform-tools/$f" windows/bin/platform-tools/ }
          Get-ChildItem windows/bin -Recurse | Select-Object FullName, Length

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: python -m pip install pillow pyinstaller pystray zeroconf qrcode sounddevice

      - name: Leave out the optional ASIO sound driver (different license)
        shell: pwsh
        run: |
          $d = python -c "import _sounddevice_data, os; print(os.path.dirname(_sounddevice_data.__file__))"
          Get-ChildItem $d -Recurse -Filter "*asio*" | ForEach-Object { Write-Host "removing $($_.FullName)"; Remove-Item $_.FullName -Force }
          Get-ChildItem $d -Recurse | Select-Object FullName

      - name: Self-test (source)
        working-directory: windows
        run: python cambridge.py --selftest

      - name: Build CamBridge.exe
        working-directory: windows
        run: >
          pyinstaller --noconfirm --onefile --windowed --name CamBridge
          --icon icon.ico
          --add-data "icon.ico;."
          --add-binary "bin/cambridge64.dll;."
          --add-binary "bin/cambridge32.dll;."
          --add-binary "bin/cbvideo.dll;."
          --add-binary "bin/platform-tools/adb.exe;platform-tools"
          --add-binary "bin/platform-tools/AdbWinApi.dll;platform-tools"
          --add-binary "bin/platform-tools/AdbWinUsbApi.dll;platform-tools"
          --add-data "bin/CamBridge.apk;."
          --add-data "../LICENSE;."
          --add-data "../THIRD_PARTY_NOTICES.md;."
          --add-data "../licenses;licenses"
          --hidden-import pystray._win32
          --collect-submodules zeroconf
          --hidden-import ifaddr
          --collect-binaries _sounddevice_data
          --hidden-import _cffi_backend
          cambridge.py

      - name: Self-test (finished .exe)
        working-directory: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/CamBridge.exe -ArgumentList "--selftest" -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "exe self-test failed: $($p.ExitCode)" }
          Get-Item dist/CamBridge.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: CamBridge-Windows
          path: windows/dist/CamBridge.exe

  release:
    name: Publish downloads
    needs: [iphone, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest --repo "$REPO" \
            --title "CamBridge (latest)" \
            --notes "Free to use — see LICENSE. CamBridge.exe → run on Windows (works with iPhone and Android). CamBridge.apk → Android app (the PC installs it for you). CamBridge.ipa → iPhone app, install with Sideloadly. Built from ${GITHUB_SHA::7}." \
            out/CamBridge-iPhone/CamBridge.ipa out/CamBridge-Windows/CamBridge.exe out/CamBridge-Android/CamBridge.apk
