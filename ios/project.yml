name: CamBridge
options:
  bundleIdPrefix: com.cambridgecam
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CamBridge:
    type: application
    platform: iOS
    sources:
      - CamBridge
    info:
      path: CamBridge/Info.plist
      properties:
        CFBundleDisplayName: CamBridge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: CamBridge uses the camera to send live video to your PC as a webcam.
        NSMicrophoneUsageDescription: CamBridge sends your microphone to the PC when you choose the phone mic there.
        NSLocalNetworkUsageDescription: CamBridge finds your PC on Wi-Fi and sends it your camera video.
        NSBonjourServices:
          - _cambridge._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.cambridgecam.app
            CFBundleURLSchemes:
              - cambridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cambridgecam.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
